name: Notify packaging

# Asks duxlabs-dev/dux-repo to rebuild now (push -> -git, release -> stable)
# instead of waiting for its 6-hour poll.

on:
  push:
    branches: [master]
    paths:
      - "core/**"
      - "quickshell/**"
      - "assets/**"
      - "Makefile"
      - ".gitmodules"
      - "dux-qml-common"
  workflow_run:
    workflows: ["Create Release"]
    types: [completed]

permissions: {}

concurrency:
  group: notify-packaging-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.repository_owner == 'duxlabs-dev' &&
      (github.event_name == 'push' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dux-repo

      - name: Dispatch dux-repo
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name == 'push' && 'greeter-git' || 'greeter-release' }}
          # head_branch is the tag name for a tag-triggered run
          REF: ${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          gh api "repos/${OWNER}/dux-repo/dispatches" \
            -f event_type="$EVENT" \
            -f "client_payload[ref]=$REF" \
            -f "client_payload[source]=${{ github.repository }}"
          echo "dispatched ${EVENT} (${REF}) to ${OWNER}/dux-repo" >> "$GITHUB_STEP_SUMMARY"
